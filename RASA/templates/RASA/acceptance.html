{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceptance</title>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One:wght@400&display=swap"
          rel="stylesheet">
    <link href="{% static 'styles/acceptance.css' %}"
          rel="stylesheet">
</head>
<body>
<section>
<div class="container">
    <!-- Верхняя панель -->
    <header>
        <a href="/" class="logo-button">
            <h1 class="logo">RASA.</h1>
        </a>
    </header>
    <div class="background">
    <div class="container">
        <section class="margin">
            <h2>Корзина</h2>
            <div class="search-form">
                <div class="search-input">
                    Заключительный тест приёмки
                </div>
                <!--<div class="search-button"></div>-->
            </div>
            {% if acceptance_engines %}
                <div class="acceptance-items">
                    {% for engine in acceptance_engines %}
                        <div class="acceptance-item">
                            <img src="{% static engine.image_url %}"
                                 alt="{{ engine.title }}" class="engine-image">
                            <div class="item-content">
                                <h3 class="engine-name">{{ engine.title }}</h3>
                                <h3 class="engine-name">Принят</h3>
                            </div>

                        </div>
                    {% endfor %}
                </div>
            {% else %}
                <p>Корзина пуста.</p>
            {% endif %}
        </section>
    </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-left">
            <p class="footer-text">Коровин Кирилл 2024</p>
        </div>
        <div class="social-icons">
            <a href="#"><img src="{% static 'RASA/vklogo.svg' %}"
                             alt="VKontakte"></a>
            <a href="#"><img src="{% static 'RASA/tglogo.svg' %}"
                             alt="Telegram"></a>
            <a href="#"><img src="{% static 'RASA/github.svg' %}"
                             alt="GitHub"></a>
        </div>
    </footer>
</div>
</section>
</body>
</html>
